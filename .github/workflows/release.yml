name: Release

# Assets are built and uploaded when a release is published. The notes are written by hand;
# this only compiles the five programs and the checksums that `agenthop update` verifies.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.4.1 --activate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: The tag and packages/cli/src/version.ts must agree
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          version="v$(node -p "require('node:fs').readFileSync('packages/cli/src/version.ts','utf8').match(/\"(.*)\"/)[1]")"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - run: node scripts/build-release.mjs

      - name: Upload the programs and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
